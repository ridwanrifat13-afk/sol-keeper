<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- M9.5: the shell is a fixed NASA blue-white for every visitor now, not OS-dependent
         (styles.css's own :root, --shell-bg/--shell-accent) — "light" here matches that fixed
         look for native browser UI (scrollbars, form controls), not the OS's own preference. -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Sol Keeper — run a Mars or Moon outpost on real NASA numbers. A Junior Astronaut Mission Trainer."
    />
    <meta name="theme-color" content="#0b3d91" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Sol Keeper</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Sol Keeper is an interactive simulation and needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
